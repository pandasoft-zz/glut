# GitLab pipeline for the glut-test mirror project (gitlab.com/glut-test/glut).
#
# GitHub ignores this file; it only runs on GitLab, where a real CI_JOB_TOKEN and
# a real GitLab API exist. It runs the composite-component integration tests
# (tests/integration/) which use `setup.components.fetch: real` to fetch the
# real fixture components from the glut-test group. See tests/integration/README.md.
#
# glut is compiled once (build-glut); the integration job reuses the binary via
# the artifact. Both the Go build and the gitlab-ci-local install are cached, so
# repeat runs only recompile what changed.

stages:
  - build
  - integration

workflow:
  rules:
    # The GitHub workflow pushes the commit, then triggers via the API; gating on
    # api/trigger/web (not push) keeps that to a single pipeline. Manual runs use
    # the "Run pipeline" button (web).
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build-glut:
  stage: build
  image: golang:1.26.2-bookworm
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.gocache/mod
    GOCACHE: $CI_PROJECT_DIR/.gocache/build
  cache:
    # Module cache keyed by go.sum (shared across branches, invalidated on dep
    # changes); build cache keyed per branch.
    - key:
        files:
          - go.sum
      paths:
        - .gocache/mod
    - key: go-build-$CI_COMMIT_REF_SLUG
      paths:
        - .gocache/build
  script:
    - CGO_ENABLED=0 go build -o glut ./cmd/glut
  artifacts:
    paths:
      - glut
    expire_in: 1h

integration:
  stage: integration
  image: node:22-slim
  needs:
    - build-glut
  variables:
    GCL_VERSION: "4.72.0"
    GCL_PREFIX: $CI_PROJECT_DIR/.npm-global
  cache:
    # gitlab-ci-local install, keyed by version — reused until GCL_VERSION bumps.
    key: gcl-$GCL_VERSION
    paths:
      - .npm-global
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends bash git rsync ca-certificates >/dev/null
    - export PATH="$GCL_PREFIX/bin:$PATH"
    - command -v gitlab-ci-local >/dev/null || npm install -g --prefix "$GCL_PREFIX" "gitlab-ci-local@${GCL_VERSION}" >/dev/null
  script:
    # Shell-executor integration tests; fetch:real pulls components from glut-test
    # using the job's real CI_JOB_TOKEN.
    - export PATH="$GCL_PREFIX/bin:$PATH"
    - ./glut run --copy-strategy=auto --include tests ./tests/integration/
