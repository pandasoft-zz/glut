name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger build
        if: steps.semantic.outputs.new_release_published == 'true'
        run: gh workflow run build.yml --ref ${{ steps.semantic.outputs.new_release_git_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
