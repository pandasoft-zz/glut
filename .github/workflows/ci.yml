name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install test tools
      run: go install gotest.tools/gotestsum@latest

    - name: Test
      run: |
        mkdir -p .artifacts
        "$(go env GOPATH)/bin/gotestsum" --junitfile .artifacts/test-results.xml --format standard-verbose -- ./...

    - name: Publish test report
      if: always()
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: .artifacts/test-results.xml
        detailed_summary: true
        include_passed: true

    - name: Coverage
      run: |
        mkdir -p .artifacts
        make test-cover-check | tee .artifacts/coverage-summary.txt
        {
          echo '## Coverage'
          echo
          echo '```text'
          cat .artifacts/coverage-summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.out
          .artifacts/coverage-summary.txt

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.4

    - name: Docker Build
      run: docker build --target dev .

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Build image
      run: docker build --target dev -t glut:dev .

    - name: Run passing integration tests
      run: |
        mkdir -p .artifacts
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          glut:dev run --include tests \
            --report=junit:/repo/.artifacts/integration-test-results.xml \
            ./tests/passing/

    - name: Run failing integration tests (expect failure)
      run: |
        if docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          glut:dev run --include tests ./tests/failing/; then
          echo "Expected integration tests to fail but they passed"
          exit 1
        fi

    - name: Publish integration test report
      if: always()
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: .artifacts/integration-test-results.xml
        detailed_summary: true
        include_passed: true
        check_name: Integration Test Results

    - name: Upload integration test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-report
        path: .artifacts/integration-test-results.xml
