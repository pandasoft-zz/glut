name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Test
      run: go test ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.4

    - name: Docker Build
      run: docker build .
