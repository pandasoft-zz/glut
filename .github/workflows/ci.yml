name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  packages: write   # push the per-commit glut image to ghcr

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Per-commit glut image, built once and reused by the GitHub Docker tests and
  # the GitLab pipeline. Tagged with the commit SHA so it is pinned exactly.
  IMAGE: ghcr.io/pandasoft-zz/glut

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install test tools
      run: go install gotest.tools/gotestsum@latest

    - name: Test
      run: |
        mkdir -p .artifacts
        "$(go env GOPATH)/bin/gotestsum" --junitfile .artifacts/test-results.xml --format standard-verbose -- ./...

    - name: Publish test report
      if: always()
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: .artifacts/test-results.xml
        detailed_summary: true
        include_passed: true

    - name: Coverage
      run: |
        mkdir -p .artifacts
        make test-cover-check | tee .artifacts/coverage-summary.txt
        {
          echo '## Coverage'
          echo
          echo '```text'
          cat .artifacts/coverage-summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.out
          .artifacts/coverage-summary.txt

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.4

  # Build the per-commit glut image once and push it to ghcr. Both the Docker
  # test job below and the GitLab pipeline pull this exact image.
  build-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push glut image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: dev
        push: true
        tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
        build-args: |
          VERSION=ci-${{ github.sha }}
          COMMIT=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  integration-test:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
    - uses: actions/checkout@v6

    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run passing integration tests
      run: |
        mkdir -p .artifacts
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          "${IMAGE}:ci-${{ github.sha }}" run --include tests \
            --report=junit:/repo/.artifacts/integration-test-results.xml \
            ./tests/passing/

    - name: Run failing integration tests (expect failure)
      run: |
        if docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          "${IMAGE}:ci-${{ github.sha }}" run --include tests ./tests/failing/; then
          echo "Expected integration tests to fail but they passed"
          exit 1
        fi

    - name: Publish integration test report
      if: always()
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: .artifacts/integration-test-results.xml
        detailed_summary: true
        include_passed: true
        check_name: Integration Test Results

    - name: Upload integration test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-report
        path: .artifacts/integration-test-results.xml

  # Composite-component integration tests can only run against a real GitLab.
  # Mirror the current commit to gitlab.com/glut-test/glut and trigger its
  # pipeline (.gitlab-ci.yml), which pulls the same ghcr image. Requires the
  # GITLAB_TOKEN secret (PAT with api + write_repository). Forked-PR runs are
  # skipped (no secrets).
  gitlab-integration:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      GITLAB_HOST: gitlab.com
      GLUT_TEST_GROUP: glut-test
      GLUT_TEST_RUNNER: glut
    steps:
      - name: Check GitLab token is available
        id: guard
        run: |
          if [ -z "${{ secrets.GITLAB_TOKEN }}" ]; then
            echo "GITLAB_TOKEN secret not set (e.g. forked PR) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          # Full history: the default shallow clone cannot be pushed to GitLab
          # ("shallow update not allowed").
          fetch-depth: 0

      - name: Mirror, trigger and wait for GitLab pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://${GITLAB_HOST}/api/v4"
          PROJECT="${GLUT_TEST_GROUP}/${GLUT_TEST_RUNNER}"
          PROJECT_ENC="${GLUT_TEST_GROUP}%2F${GLUT_TEST_RUNNER}"
          REF="ci/${GITHUB_SHA}"

          gl() { curl -fsS --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "$@"; }

          echo "Resolving project ${PROJECT}…"
          PROJECT_ID="$(gl "${API}/projects/${PROJECT_ENC}" | jq -r '.id')"
          test -n "${PROJECT_ID}" && test "${PROJECT_ID}" != "null"
          echo "GITLAB_PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

          echo "Pushing ${GITHUB_SHA} to ${PROJECT} as ${REF}…"
          git push -f "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/${PROJECT}.git" "HEAD:refs/heads/${REF}"

          echo "Triggering pipeline on ${REF}…"
          HTTP="$(curl -sS -o /tmp/trigger.json -w '%{http_code}' \
            --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --data "ref=${REF}" "${API}/projects/${PROJECT_ID}/pipeline")"
          if [ "${HTTP}" -ge 300 ]; then
            echo "Pipeline create failed (HTTP ${HTTP}):"; cat /tmp/trigger.json; echo; exit 1
          fi
          PIPELINE_ID="$(jq -r '.id' /tmp/trigger.json)"
          PIPELINE_URL="$(jq -r '.web_url' /tmp/trigger.json)"
          echo "GITLAB_PIPELINE_ID=${PIPELINE_ID}" >> "$GITHUB_ENV"
          echo "Pipeline ${PIPELINE_ID}: ${PIPELINE_URL}"
          echo "GitLab pipeline: ${PIPELINE_URL}" >> "$GITHUB_STEP_SUMMARY"

          echo "Waiting for completion…"
          for _ in $(seq 1 180); do  # up to ~30 min
            STATUS="$(gl "${API}/projects/${PROJECT_ID}/pipelines/${PIPELINE_ID}" | jq -r '.status')"
            echo "  status: ${STATUS}"
            case "${STATUS}" in
              success) echo "GitLab pipeline succeeded."; exit 0 ;;
              failed|canceled|skipped) echo "GitLab pipeline ended: ${STATUS} (${PIPELINE_URL})"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for GitLab pipeline (${PIPELINE_URL})."
          exit 1

      - name: Cancel the GitLab pipeline and clean up the branch
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # On cancellation/failure, stop the (possibly still running) GitLab
          # pipeline so it does not orphan, then delete the CI branch.
          if [ -n "${GITLAB_PIPELINE_ID:-}" ] && [ -n "${GITLAB_PROJECT_ID:-}" ]; then
            curl -sS --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://${GITLAB_HOST}/api/v4/projects/${GITLAB_PROJECT_ID}/pipelines/${GITLAB_PIPELINE_ID}/cancel" \
              -o /dev/null || true
          fi
          REF="ci/${GITHUB_SHA}"
          curl -sS --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://${GITLAB_HOST}/api/v4/projects/${GLUT_TEST_GROUP}%2F${GLUT_TEST_RUNNER}/repository/branches/$(printf '%s' "${REF}" | sed 's:/:%2F:g')" \
            -o /dev/null || true
