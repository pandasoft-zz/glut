version: 2

project_name: glut

before:
  hooks:
    - go mod tidy

builds:
  - id: glut
    main: ./cmd/glut
    binary: glut
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: false

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: glut
    ids:
      - glut
    dockerfile: Dockerfile
    images:
      - ghcr.io/pandasoft-zz/glut
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "glut"
      "org.opencontainers.image.description": "Tool for unit testing GitLab pipelines."
      "org.opencontainers.image.url": "https://github.com/pandasoft-zz/glut"
      "org.opencontainers.image.source": "https://github.com/pandasoft-zz/glut"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "MIT"
    annotations:
      "org.opencontainers.image.title": "glut"
      "org.opencontainers.image.description": "Tool for unit testing GitLab pipelines."
      "org.opencontainers.image.url": "https://github.com/pandasoft-zz/glut"
      "org.opencontainers.image.source": "https://github.com/pandasoft-zz/glut"
      "org.opencontainers.image.licenses": "MIT"
    sbom: false

release:
  mode: append
  header: |
    ## Docker Images

    ```bash
    docker pull ghcr.io/pandasoft-zz/glut:{{ .Tag }}
    ```

    Supported platforms: `linux/amd64` · `linux/arm64`

    Browse on GHCR: https://github.com/pandasoft-zz/glut/pkgs/container/glut

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
