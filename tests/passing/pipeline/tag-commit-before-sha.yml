stages: [test]

check-before-sha:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "before_sha=$CI_COMMIT_BEFORE_SHA"
---
.glut:
  name: "tag pipeline sets CI_COMMIT_BEFORE_SHA to zero SHA"
  setup:
    tag: "v3.1.4"
  assert:
    job:
      check-before-sha:
        exit-status: 0
        stdout:
          - "before_sha=0000000000000000000000000000000000000000"
