stages: [test]

root-image-job:
  stage: test
  image: alpine:latest
  script:
    - id -u
    - echo "root image job ok"

rootless-image-job:
  stage: test
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  script:
    - buildctl-daemonless.sh --version || true
    - mkdir -p dist
    - echo "rootless image job ok" > dist/rootless.txt
  artifacts:
    paths:
      - dist/rootless.txt
---
.glut:
  name: "docker:true supports root and rootless images"
  setup:
    branch: main
    docker: true
  assert:
    job:
      root-image-job:
        present: true
        exit-status: 0
        stdout:
          - "root image job ok"
      rootless-image-job:
        present: true
        exit-status: 0
    # GCL 4.72.0 can lose Docker stdout after a slow first command.
    # Assert an artifact until that bug is fixed upstream.
    artifacts:
      "dist/rootless.txt":
        exists: true
        contents:
          - "rootless image job ok"
