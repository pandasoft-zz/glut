stages: [test]

sast:
  stage: test
  script:
    - |
      cat > gl-sast-report.json << 'EOF'
      {
        "version": "15.0.0",
        "vulnerabilities": [
          {"id": "1", "severity": "Medium", "name": "SQL injection"},
          {"id": "2", "severity": "Low", "name": "Missing header"},
          {"id": "3", "severity": "Low", "name": "Weak cipher"}
        ]
      }
      EOF
  artifacts:
    reports:
      sast: gl-sast-report.json
---
.glut:
  name: "artifact report gitlab-security: vulnerability count by severity"
  setup:
    branch: "main"
    pipeline_source: "push"
  assert:
    job:
      sast:
        exit-status: 0
    artifacts:
      "gl-sast-report.json":
        exists: true
        report:
          format: gitlab-security
          critical: 0
          high: 0
          medium: 1
          low: {ge: 1}
