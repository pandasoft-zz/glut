stages: [test]

api-in-docker:
  image: alpine:latest
  stage: test
  script:
    - apk add --no-cache --quiet curl
    - curl -sf --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" "$CI_API_V4_URL/projects/1" -o /dev/null
    - echo "api call ok"
---
.glut:
  name: "docker:true CI_API_V4_URL uses bridge IP reachable from containers (BUG-3 regression)"
  setup:
    branch: main
    docker: true
    api:
      token:
        valid: true
      project:
        path: "test-group/test-project"
        default_branch: main
  assert:
    job:
      api-in-docker:
        exit-status: 0
    api:
      "GET /api/v4/projects/1":
        called: true
        times: 1
