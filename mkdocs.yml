  - Reference:
      - Test Format: reference/test-format.md
      - Assert Syntax: reference/assert-syntax.md
      - Mock API: reference/mock-api.md
      - CLI: reference/cli.md
  - Examples:
      - Image Build: examples/image-build.md
      - Manifest Update: examples/manifest-update.md
      - Release: examples/release.md
